<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品合集</title>
     <link rel="stylesheet" href="../css/style-por.css"><!--css-->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous"><!--bootstrap-->
</head>
     <!--字型-->
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Cactus+Classical+Serif&display=swap" rel="stylesheet">
     <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@200..900&display=swap" rel="stylesheet">
     <!--中文字型-->
     <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap" rel="stylesheet"><!--數字字型-->
</head>
<body>

    <div class="nav-top"><!--測試-->
        123
        <div class="nav-button"><!--縮過小時需要變成可展開的按鈕-->
            <button>回到首頁</button>
            <button>作品合集</button>
            <button>個人資料</button>
            <button>不可使用</button>
        </div>
        <div class="nav-button-phone"><!--手機版的按鈕，點擊後會展開選單-->
            <button class="phone-menu-btn">☰</button>
            <div class="phone-menu" style="display:none;">
                <button>回到首頁</button>
                <button>作品合集</button>
                <button>個人資料</button>
                <button>不可使用</button>
            </div>
        </div>
    </div>
        
    <div class="header-row">
        <div class="irasuto-header"></div>

    </div>

        <!--第一頁-->
    <div class="nav-main" id="page1" style="border-radius: 5px;">
        <!----------------------------------------待填入---------------------------------------------->
        
    </div>


        <!-------------------------------------------------第二頁-------------------------------------------->
    <div class="nav-main" id="page2" style="display:none;">
    </div>

        <!-------------------------------------------------第三頁------------------------------------------------------>
    <div class="nav-main" id="page3" style="display:none;">
        <div class="nav-years">
            <p>第三頁</p><hr>
        </div>   
    </div>

        <!--第四頁-->
    <div class="nav-main" id="page4" style="display:none;">
        <div class="nav-years">
            <p>第四頁</p><hr>
        </div>   
    </div>
        

        <!--大圖區域-->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel"></h5> <!--大圖的標題，-->
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button> <!--右上角的關閉按鈕-->
                </div>

                <div class="modal-body text-center">
                    <img id="modalImage" class="img-fluid"> <!--大圖的img，會根據點擊的小圖改變src-->
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script> <!--bootstrap的js-->
    <script>
        //先讀取有card-img-top的圖片，讓這些圖片能點擊後有大圖
        document.querySelectorAll('.card-img-top').forEach(img => {
            img.addEventListener('click', function () {
                document.getElementById('modalImage').src = this.dataset.img;
               document.getElementById('exampleModalLabel').textContent = this.dataset.title ;
            });
        });

            //切換頁面功能
        function showPage(pageNumber) {
            document.getElementById('page1').style.display = 'none';
            document.getElementById('page2').style.display = 'none';
            document.getElementById('page3').style.display = 'none';
            document.getElementById('page4').style.display = 'none';

            document.getElementById('page' + pageNumber).style.display = 'block';

            document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-link')[pageNumber - 1].classList.add('active');
        }

        //手機版選單功能
        document.querySelector('.phone-menu-btn').addEventListener('click', function() {
            const menu = document.querySelector('.phone-menu');
            if (menu.style.display === 'none' || menu.style.display === '') {
                menu.style.display = 'flex';
                menu.classList.add('active');
            }
            else {
                menu.style.display = 'none';
            }
        });
        

    </script>
</body>
</html>
